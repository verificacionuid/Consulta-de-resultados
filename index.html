<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Resultados - Laboratorios Gamboa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Logo */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            background-color: #ffffff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            max-height: 65px;
            width: auto;
            object-fit: contain;
        }

        /* Green Title Bar */
        .title-bar {
            background-color: #16a075;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* Fieldset Box */
        .fieldset-box {
            border: 1px solid #dcdcdc;
            border-radius: 3px;
            padding: 30px 40px 35px 40px;
            width: 600px;
            max-width: 90%;
            position: relative;
        }

        .fieldset-legend {
            position: absolute;
            top: -10px;
            left: 15px;
            background-color: #ffffff;
            padding: 0 8px;
            color: #337ab7;
            font-size: 13px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 13px;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-input {
            width: 250px;
            height: 34px;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        .form-input:focus {
            border-color: #66afe9;
            box-shadow: inset 0 1px 1px rgba(0,0,0,.075), 0 0 8px rgba(102, 175, 233, .6);
        }

        /* Captcha Styling */
        .captcha-container {
            margin: 10px 0 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .captcha-box {
            background-color: #f8f9fa;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 8px 16px;
            user-select: none;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 250px;
            height: 50px;
            cursor: pointer;
        }

        .captcha-text {
            font-family: 'Comic Sans MS', 'Courier New', cursive, monospace;
            font-size: 26px;
            font-weight: bold;
            color: #0b4f8a;
            letter-spacing: 6px;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            transform: skewX(-10deg);
        }

        .captcha-line {
            position: absolute;
            width: 120%;
            height: 2px;
            background: rgba(11, 79, 138, 0.4);
            top: 50%;
            left: -10%;
            transform: rotate(-5deg);
        }

        .captcha-line-2 {
            position: absolute;
            width: 120%;
            height: 2px;
            background: rgba(11, 79, 138, 0.3);
            top: 40%;
            left: -10%;
            transform: rotate(6deg);
        }

        .btn-submit {
            width: 250px;
            height: 38px;
            background-color: #f08a34;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e07923;
        }

        .error-message {
            color: #d9534f;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px 0 25px 0;
            font-size: 12px;
            color: #666666;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <!-- Asegúrate de renombrar tu imagen o ajustar el src con el nombre exacto de tu archivo en GitHub -->
            <img src="logo.png" alt="Laboratorios Gamboa" class="logo-img">
        </div>
    </header>

    <!-- Green Bar -->
    <div class="title-bar">
        CONSULTA DE RESULTADOS
    </div>

    <!-- Main Container -->
    <main>
        <div class="fieldset-box">
            <div class="fieldset-legend">Valida resultados</div>

            <form id="resultsForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="solicitud">Solicitud:</label>
                    <input type="text" id="solicitud" class="form-input" value="8263003" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Escriba los caracteres de la imagen:</label>
                    <div class="captcha-container">
                        <div class="captcha-box" onclick="generateCaptcha()" title="Haz clic para cambiar captcha">
                            <span class="captcha-line"></span>
                            <span class="captcha-line-2"></span>
                            <span id="captchaCode" class="captcha-text"></span>
                        </div>
                        <input type="text" id="captchaInput" class="form-input" placeholder="" required autocomplete="off">
                        <div id="errorMessage" class="error-message">Código captcha incorrecto. Inténtalo de nuevo.</div>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-submit">Aceptar</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        Powered by <strong style="color: #6a1b9a;">CogniTI</strong>
    </footer>

    <script>
        // Reemplaza esta variable con el string Base64 completo de tu documento PDF si deseas visualizarlo al dar clic en Aceptar
        const pdfBase64 = "data:application/pdf;base64,";

        let currentCaptcha = "";

        function generateCaptcha() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let code = "";
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = code;
            document.getElementById("captchaCode").textContent = code;
            document.getElementById("captchaInput").value = "";
            document.getElementById("errorMessage").style.display = "none";
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const userInput = document.getElementById("captchaInput").value.trim().toUpperCase();
            const errorMessage = document.getElementById("errorMessage");

            if (userInput === currentCaptcha) {
                errorMessage.style.display = "none";
                openPdfViewer();
            } else {
                errorMessage.style.display = "block";
                generateCaptcha();
            }
        }

        function openPdfViewer() {
            if (pdfBase64.length < 50) {
                alert("Consulta exitosa. Agrega la cadena Base64 en la variable pdfBase64 para abrir el documento.");
                return;
            }

            try {
                const base64Content = pdfBase64.split(',')[1] || pdfBase64;
                const byteCharacters = atob(base64Content);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                
                window.open(blobUrl, '_blank');
            } catch (err) {
                window.open(pdfBase64, '_blank');
            }
        }

        window.onload = generateCaptcha;
    </script>
</body>
</html>
